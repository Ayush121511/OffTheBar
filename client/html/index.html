        <meta property="og:url" content="https://chat.acy.dev">
        <link rel="stylesheet" href="/assets/css/style.css">
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">

        <script>
            const user_image        = `<img src="/assets/img/UserIconFootball.png" alt="User Avatar">`;
            const gpt_image         = `<img src="/assets/img/LLMIcon.jpg" alt="GPT Avatar">`;
        </script>
        <style>
            .hljs {
                color: #e9e9f4;
                background: #28293629;
                border-radius: var(--border-radius-1);
                border: 1px solid var(--blur-border);
                font-size: 15px;
            }

            #message-input {
                margin-right: 30px;
                height: 80px;
            }

            #message-input::-webkit-scrollbar {
                width: 5px;
            }

            /* Track */
            #message-input::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            /* Handle */
            #message-input::-webkit-scrollbar-thumb {
                background: #c7a2ff;
            }

            /* Handle on hover */
            #message-input::-webkit-scrollbar-thumb:hover {
                background: #8b3dff;
            }
        </style>
        <script src="/assets/js/highlight.min.js"></script>
        <script src="/assets/js/highlightjs-copy.min.js"></script>
        <script>window.conversation_id = `{{chat_id}}`</script>
        <title>OffTheBar</title>
    </head>
    <body>

        <div class="gradient"></div>
        <div class="row">
            <div class="box conversations">
                <div class="top">
                    <button class="new_convo" onclick="new_conversation()">
                        <i class="fa-regular fa-plus"></i>
                        <span>New Session</span>
                    </button>
                    <div class="spinner"></div>
                </div>
                <div class="bottom_buttons">
                    <button onclick="delete_conversations()">
                        <i class="fa-regular fa-trash"></i>
                        <span>Clear Conversations</span>
                    </button>
                    <div class="info">
                        <i class="fa-regular fa-circle-info"></i>
                        <span class="convo-title">
                            <p style="text-align: center;">Developed by<br>
                                <b>THE RUN OF PLAY</b><br>
                            WHERE EVERY <br>
                            PLAY COUNTS</p>
                        </span>
                    </div>
                </div>
            </div>
            <div class="conversation disable-scrollbars">
                <div class="stop_generating stop_generating-hidden">
                    <button id="cancelButton">
                        <span>Stop Generating</span>
                        <i class="fa-regular fa-stop"></i>
                    </button>
                </div>
                <div class="box" id="messages">
                </div>
                <div class="user-input">
                    <div class="box input-box">
                        <textarea id="message-input" placeholder="What's your play.." cols="30" rows="15" style="white-space: pre-wrap;" oninput="resizeTextarea(this)"></textarea>
                        <div id="send-button">
                            <i class="fa-regular fa-paper-plane-top"></i>
                        </div>
                    </div>
                </div>
                <div class="buttons">
                    <!--<div class="field">-->

                    <!--    <span class="about">Web Access</span>-->
                    <!--</div>-->
                    <div class="field">
                        <select name="model" id="model">
                            <option value="Off The Bar">Off The Bar</option>
                        </select>
                         <span class="about">Model</span>
                    </div>
                    <div class="field">
                        <select name="jailbreak" id="jailbreak">
                            <option value="default" selected>v 1.0</option>
                            <!--<option value="gpt-math-1.0">math 1.0</option>-->
                            <!--<option value="gpt-dude-1.0">dude 1.0</option>-->

                            <!--<option value="gpt-evil-1.0">evil 1.0</option>-->
                        </select>
                    </div>

                <form class="color-picker" action="">
                    <fieldset>
                        <legend class="visually-hidden">Pick a color scheme</legend>
                        <label for="light" class="visually-hidden">Light</label>
                        <input type="radio" title="light" name="theme" id="light" checked>

                        <!--<label for="pink" class="visually-hidden">Pink theme</label>-->

                        <!--<input type="radio" title="dark" id="dark" name="theme">-->
                    </fieldset>
                    </form>
                </div>
            </div>
        </div>
