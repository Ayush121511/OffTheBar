<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off The Bar - local Wix preview</title>
<style>
  body{ margin:0; font:14px/1.4 system-ui, sans-serif; background:#fafafa; color:#111; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:8px 12px; background:#111; color:#eee; }
  .toolbar a{ color:#9cf; }
  .toolbar b{ color:#fff; }
  #problem{ padding:8px 12px; background:#fde8e8; color:#8a1c1c; border-bottom:1px solid #f5c2c2; }
  .page{ max-width:1000px; margin:0 auto; padding:0 12px; }
  #titleStack{ cursor:pointer; padding:14px 0 6px; font-size:22px; font-weight:700; }
  #titleStack small{ font-size:12px; font-weight:400; color:#666; }
  #chatHtml{ display:block; width:100%; height:62vh; border:1px solid #ddd; background:#fff; }
  .inputRow{ display:flex; gap:8px; align-items:center; margin-top:8px; }
  #inputHtml{ flex:1; height:100px; border:0; }
  #sendBtn{ padding:10px 16px; border-radius:10px; border:1px solid #000; background:#fff; cursor:pointer; }
  #sendBtn:disabled{ opacity:.5; cursor:default; }
  details{ margin:10px 0 24px; }
  pre{ white-space:pre-wrap; word-break:break-word; background:#fff; border:1px solid #ddd; padding:8px; max-height:300px; overflow:auto; }
</style>

<!-- The page code's imports, resolved locally. Wix installs `marked` from npm;
     check the version in the Wix package manager if rendering ever differs. -->
<script type="importmap">
{
  "imports": {
    "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.esm.js",
    "wix-location": "./wix-location.js"
  }
}
</script>

<script>
// Minimal stand-in for Wix's $w, covering only what offthebar-page.js uses.
(function () {
  const cache = {};

  function htmlEmbed(iframe) {
    return {
      postMessage(data) { if (iframe.contentWindow) iframe.contentWindow.postMessage(data, '*'); },
      onMessage(cb) {
        window.addEventListener('message', (ev) => { if (ev.source === iframe.contentWindow) cb({ data: ev.data }); });
      }
    };
  }

  function button(el) {
    return {
      get label() { return el.textContent; },
      set label(v) { el.textContent = v; },
      enable() { el.disabled = false; return Promise.resolve(); },
      disable() { el.disabled = true; return Promise.resolve(); },
      onClick(cb) { el.addEventListener('click', cb); }
    };
  }

  window.$w = function (selector) {
    if (cache[selector]) return cache[selector];
    const el = document.getElementById(selector.slice(1));
    if (!el) throw new Error(`The preview has no element ${selector}`);
    cache[selector] = el.tagName === 'IFRAME' ? htmlEmbed(el)
      : el.tagName === 'BUTTON' ? button(el)
      : { onClick(cb) { el.addEventListener('click', cb); } };
    return cache[selector];
  };
  window.$w.onReady = (cb) => cb();   // module scripts run after the DOM is parsed
})();

// Route /api/chat to the chosen backend (?backend=mock|local|live) and show
// each request body, so the history sent to the API can be checked.
(function () {
  const backend = new URLSearchParams(location.search).get('backend') || 'mock';
  const realFetch = window.fetch.bind(window);
  const encoder = new TextEncoder();
  window.PREVIEW_BACKEND = backend;

  window.fetch = (url, opts) => {
    if (typeof url === 'string' && url.endsWith('/api/warm')) {
      console.log('[preview] /api/warm');
      if (backend === 'mock') return Promise.resolve(new Response('{"ready": true}', { status: 200 }));
      return realFetch(backend === 'local' ? 'http://localhost:1338/api/warm' : url, opts);
    }
    if (typeof url !== 'string' || !url.endsWith('/api/chat')) return realFetch(url, opts);

    const body = JSON.parse(opts.body);
    console.log('[preview] /api/chat request', body);
    const panel = document.getElementById('lastRequest');
    if (panel) panel.textContent = JSON.stringify(body, null, 2);

    if (backend === 'mock') return mockChat(body, opts.signal);

    // The page code only shows a generic error (right for real users), so say what failed here.
    const target = backend === 'local' ? 'http://localhost:1338/api/chat' : url;
    return realFetch(target, opts)
      .then((res) => {
        if (!res.ok) showProblem(`/api/chat returned HTTP ${res.status}`);
        return res;
      })
      .catch((err) => {
        if (err.name !== 'AbortError') {
          showProblem(backend === 'local'
            ? 'Local backend not reachable at http://localhost:1338 - start it from the repo root with: python -u run.py'
            : `Live API request failed: ${err.message}`);
        }
        throw err;
      });
  };

  function showProblem(text) {
    const el = document.getElementById('problem');
    el.textContent = text;
    el.hidden = false;
  }

  // Imitates server/backend.py's two-phase stream: a status line per stage
  // (Run of Play search, Generating, draft, web search, Generating, refinement).
  // A message containing `mock-nothing-new` ends on the draft, like a Phase 2
  // that finds nothing new.
  function mockChat(body, signal) {
    const question = body.meta.content.parts[0].content;
    if (/mock-unreachable/i.test(question)) {
      return Promise.reject(new TypeError('Failed to fetch'));
    }
    if (/mock-busy/i.test(question)) {
      return Promise.resolve(new Response('Rate exceeded.', { status: 429 }));
    }
    if (/mock-error/i.test(question)) {
      return Promise.resolve(new Response('{"error": "mock failure"}', { status: 500 }));
    }

    const phase1 = `Mock draft for "${question}" - the ball's rolling, but this is a rehearsal, not the match. ` +
      'Here comes a **bold** claim and a short list:\n\n- first point\n- second point';
    const phase2 = '### Mock update\nPhase 2 lands like a late winner. Raw HTML should show as text: ' +
      '<b>not bold</b>.\n\nAsk next:\n- What else happened?\n- Who starts "next" week & why?';

    // Bursts of ~80 characters, like Gemini's real stream, so the page's
    // word-by-word reveal is what makes it look smooth.
    const bursts = (text) => text.match(/[\s\S]{1,80}(\s|$)/g) || [];
    if (/mock-cut-off/i.test(question)) {
      const parts = ['Mock draft that loses its connection.\n\n', '## HALFTIME!!! Searching the web\n\n'];
      const cut = new ReadableStream({ start(c) { parts.forEach((p) => c.enqueue(encoder.encode(p))); setTimeout(() => c.close(), 400); } });
      return Promise.resolve(new Response(cut, { status: 200 }));
    }
    const status = (text) => `## HALFTIME!!! ${text}\n\n`;
    const script = [[0, status('Searching The Run of Play')], [1800, status('Generating')], [900, '']];
    bursts(phase1).forEach((b) => script.push([150, b]));
    script.push([60, '\n\n' + status('Searching the web')]);
    script.push([2000, status('Generating')]);
    script.push([900, '']);   // Phase 2's wait for its first words
    if (!/mock-nothing-new/i.test(question)) {
      bursts(phase2).forEach((b) => script.push([150, b]));
    }
    // The second link is a web page and must not show; the title's HTML must show as text.
    if (body.sources) {
      script.push([100, '\n\n## SOURCES!!! ' + JSON.stringify([
        { title: 'Mock <b>Run of Play</b> article', url: 'https://www.therunofplay.com/post/mock-article' },
        { title: 'Mock web page', url: 'https://example.com/not-run-of-play' },
      ]) + '\n']);
    }

    let timers = [];
    const stop = () => { timers.forEach(clearTimeout); timers = []; };
    const stream = new ReadableStream({
      start(controller) {
        let t = 0;
        for (const [delay, text] of script) {
          t += delay;
          timers.push(setTimeout(() => { if (text) controller.enqueue(encoder.encode(text)); }, t));
        }
        timers.push(setTimeout(() => controller.close(), t + 50));
        if (signal) signal.addEventListener('abort', () => {
          stop();
          try { controller.error(new DOMException('Aborted', 'AbortError')); } catch (_) {}
        });
      },
      cancel: stop
    });
    return Promise.resolve(new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream' } }));
  }
})();
</script>

<!-- The page code itself, unmodified. It and the two embeds load under a new
     URL every time, so the browser never runs a cached older copy against a
     newer backend (an old chat-iframe.html kept showing typing dots). -->
<script type="module">import(`../offthebar-page.js?v=${Date.now()}`);</script>
</head>
<body>
  <div class="toolbar">
    <span>Backend: <b id="backendName"></b></span>
    <a href="?backend=mock">mock</a>
    <a href="?backend=local">local (python run.py)</a>
    <a href="?backend=live">live Cloud Run (uses Gemini quota)</a>
    <span>|</span>
    <a id="msgLink" href="#">try a ?msg= link</a>
  </div>
  <div id="problem" hidden></div>

  <div class="page">
    <div id="titleStack">Off The Bar <small>(click = new chat, like the Wix title)</small></div>
    <iframe id="chatHtml" data-src="../chat-iframe.html"></iframe>
    <div class="inputRow">
      <iframe id="inputHtml" data-src="../input-iframe.html"></iframe>
      <button id="sendBtn">➤ Send</button>
    </div>
    <script>
      document.querySelectorAll('iframe[data-src]').forEach((f) => { f.src = `${f.dataset.src}?v=${Date.now()}`; });
    </script>
    <details>
      <summary>Last /api/chat request body</summary>
      <pre id="lastRequest">(nothing sent yet)</pre>
    </details>
  </div>

  <script>
    document.getElementById('backendName').textContent = window.PREVIEW_BACKEND;
    document.getElementById('msgLink').href = `?backend=${window.PREVIEW_BACKEND}&msg=${encodeURIComponent('Who won the 2010 World Cup?')}`;
  </script>
</body>
</html>
