<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');

  :root{
    --font: 'Google Sans', sans-serif;
    --text: #121212;
    --muted:#6b6b6b;
    --bg: #ffffff;
    --bubble:#f6f6f6;
    --maxw: 960px;

    /* measured at runtime for padding */
    --stopbar-h: 0px;

    /* stop button theme (overridable by parent via set-theme-vars) */
    --stop-bg: #f5f5f5;
    --stop-border:#e6e6e6;
    --stop-text:#111;
    --stop-bg-hover:#ececec;
    --stop-border-hover:#dcdcdc;
  }

  *{box-sizing:border-box}
  html,body{ margin:0;padding:0;background:var(--bg); font-family:var(--font);color:var(--text) }
  body{overflow-x:hidden}

  .wrap{display:flex;justify-content:center;width:100%}

  /* ✅ Only reserve stopbar height + tiny gap (not the footer height) */
  .log{
    width:100%;max-width:var(--maxw);
    padding:8px 12px calc(var(--stopbar-h) + 1px);
  }

  .msg{
    margin:14px 0 22px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .msg.user{ justify-content:flex-end; }
  .msg.bot { justify-content:flex-start; }

  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:inline-block;object-fit:cover;margin:0;
    flex:0 0 auto;
    align-self:flex-start;
  }

  .bubble{
    display:inline-block;
    max-width: calc(100% - 56px);
    background:var(--bubble);
    border:1px solid #eaeaea;border-radius:14px;
    padding:12px 14px;font-size:16px;line-height:1.55;
    word-wrap:break-word;text-align:left;
  }

  .content{
    display:block;max-width: calc(100% - 56px);
    font-size:16px;line-height:1.55;word-wrap:break-word;
  }

  .bubble :where(p,ul,ol,pre,code,h1,h2,h3),
  .content :where(p,ul,ol,pre,code,h1,h2,h3){ margin:.45em 0 }

  .bubble code, .content code{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:.95em
  }

  .bubble h1, .content h1 { font-size:28px; line-height:1.25; margin:.25em 0 .35em; font-weight:700; }
  .bubble h2, .content h2 { font-size:22px; line-height:1.3;  margin:.25em 0 .35em; font-weight:700; }
  .bubble h3, .content h3 { font-size:18px; line-height:1.35; margin:.25em 0 .3em;  font-weight:600; }

  .cursor{display:inline-block;width:8px;height:1em;vertical-align:-2px;animation:blink 1s steps(1,start) infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* Stop bar stays 125px above the bottom (above blurred footer) */
  .stopbar {
    position: sticky;
    bottom: 125px; /* fixed gap = footer height */
    z-index: 10;
    background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    padding: 10px 8px 14px;
  }
  .stopbar-inner {
    width:100%;
    max-width: var(--maxw);
    display:flex;
    justify-content: flex-end;
  }
  #stopBtn {
    appearance: none;
    border-radius: 999px;
    padding: 8px 14px;
    font: 500 14px/1 var(--font);
    border: 1px solid var(--stop-border);
    background: var(--stop-bg);
    color: var(--stop-text);
    cursor: pointer;
    display: none; /* shown only while streaming */
  }
  #stopBtn:hover {
    background: var(--stop-bg-hover);
    border-color: var(--stop-border-hover);
  }

  /* Blurred footer (kept) */
  .blank-footer {
    position: sticky;
    bottom: 0;
    z-index: 5;
    height: 125px; /* locked */
    background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
  }

  /* Typing dots shown until the first chunk arrives */
  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    height: 24px;
  }
  .typing span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #000;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1; }
  }

  /* Phase 2 status ("Checking the latest news") under the draft: a quiet
     shimmer, like a "thinking" label */
  .otb-status {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.92em;
    color: var(--muted);
    background: linear-gradient(90deg, var(--muted) 40%, var(--text) 50%, var(--muted) 60%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: otb-shimmer 2s linear infinite;
  }
  @keyframes otb-shimmer {
    from { background-position: 150% 0; }
    to   { background-position: -50% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .otb-status { animation: none; -webkit-text-fill-color: var(--muted); }
  }
  .otb-status-time { font-variant-numeric: tabular-nums; }

  /* Follow-up suggestions under a finished answer - only the latest answer's */
  .otb-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .msg:not(:last-child) .otb-suggestions { display: none; }
  .otb-suggestion {
    font: inherit;
    font-size: 14px;
    line-height: 1.35;
    text-align: left;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--stop-border);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .otb-suggestion:hover { background: var(--stop-bg-hover); border-color: var(--stop-border-hover); }
  .otb-suggestion:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="log" id="log"><!-- messages go here --></div>
  </div>

  <div class="stopbar" id="stopbar">
    <div class="stopbar-inner">
      <button id="stopBtn" title="Stop generating">■ Stop</button>
    </div>
  </div>

  <div class="blank-footer" aria-hidden="true"></div>

<script>
  const BLANK_FOOTER = 125;   // footer height (kept)
  const DESIRED_GAP  = 1;     // space above stopbar for last bubble

  const log = document.getElementById('log');
  const stopBtn = document.getElementById('stopBtn');
  const stopbar = document.getElementById('stopbar');

  let userAvatar = '';
  let botAvatar  = '';
  let lastWasBot = false;

  function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

  function avatarImg(src){
    const img = el('img','avatar');
    // Check the URL itself - an empty img.src can read back as this page's URL
    if (src) img.src = src;
    else img.style.display = 'none';
    return img;
  }

  /* 🎯 Precise autoscroll helper */
  function scrollToBottom(smooth = false){
    const last = log.lastElementChild;
    const stopH = stopbar?.offsetHeight || 0;
    const contentBottom = last
      ? last.getBoundingClientRect().bottom + window.scrollY
      : document.documentElement.scrollHeight;

    const target = Math.max(
      0,
      contentBottom - (window.innerHeight - stopH - BLANK_FOOTER - DESIRED_GAP)
    );

    const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    const clamped = Math.min(target, maxScroll);

    try { window.scrollTo({ top: clamped, behavior: smooth ? 'smooth' : 'auto' }); }
    catch { window.scrollTo(0, clamped); }
  }

  function addMessage({who, html}){
    const msg = el('div', 'msg ' + (who === 'user' ? 'user' : 'bot'));

    if (who === 'user') {
      const bubble = el('div','bubble');
      bubble.innerHTML = html;
      msg.appendChild(bubble);
      msg.appendChild(avatarImg(userAvatar));
      log.appendChild(msg);

      /* ✅ Auto-scroll ONLY on new user message */
      scrollToBottom(true);
      lastWasBot = false;
      return;
    }

    // Bot message (begin) - empty html means "streaming starts": show typing dots
    msg.appendChild(avatarImg(botAvatar));

    const content = el('div','content');
    content.innerHTML = html === ''
      ? '<div class="typing"><span></span><span></span><span></span></div>'
      : html;
    msg.appendChild(content);

    log.appendChild(msg);
    lastWasBot = true;

    /* ✅ Auto-scroll ONLY when bot message begins (first bubble) */
    scrollToBottom(true);
  }

  // The current bot message's content, creating the message first if the
  // parent's 'add-message' never arrived (e.g. posted before this iframe loaded)
  function botContent(){
    const last = log.lastElementChild;
    if (lastWasBot && last && last.querySelector('.content')) return last.querySelector('.content');
    addMessage({ who:'bot', html:'' }); // will scroll once at start
    return log.lastElementChild.querySelector('.content');
  }

  function updateBotHtml(partialHtml, showCursor = true){
    // ⛔ No auto-scroll during streaming
    botContent().innerHTML = partialHtml + (showCursor ? '<span class="cursor"></span>' : '');
    syncStatusTimer();
  }

  function finalizeBot(finalHtml){
    // ⛔ No auto-scroll on finalize (keeps user position)
    if (finalHtml) botContent().innerHTML = finalHtml; // never blank an answer that's already on screen
    syncStatusTimer();
  }

  // Live seconds on the Phase 2 status line, like a "thinking" timer. Nothing
  // streams while Phase 2 loads, so the count runs here rather than in the page code.
  let statusTimer = null;
  let statusStartedAt = 0;

  function formatElapsed(ms){
    const s = Math.floor(ms / 1000);
    return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }

  function tickStatus(){
    const status = log.querySelector('.otb-status');
    if (!status) return;
    let time = status.querySelector('.otb-status-time');
    if (!time){
      time = el('span', 'otb-status-time');
      status.appendChild(time);
    }
    time.textContent = ' · ' + formatElapsed(Date.now() - statusStartedAt);
  }

  // Each re-render replaces the status element, so the start time lives here.
  function syncStatusTimer(){
    if (!log.querySelector('.otb-status')){
      clearInterval(statusTimer);
      statusTimer = null;
      statusStartedAt = 0;
      return;
    }
    if (!statusStartedAt) statusStartedAt = Date.now();
    tickStatus();
    if (!statusTimer) statusTimer = setInterval(tickStatus, 1000);
  }

  // Measure stopbar height so .log can reserve just enough room
  function updateHeights(){
    const h = (stopbar && stopbar.offsetHeight) ? stopbar.offsetHeight : 0;
    document.documentElement.style.setProperty('--stopbar-h', h + 'px');
  }

  function announceReady(){
    window.parent.postMessage({ type:'iframe-ready' }, '*');
  }

  // On load/resize: update layout only, no forced scroll
  window.addEventListener('load', () => { updateHeights(); });
  window.addEventListener('resize', () => { updateHeights(); });

  // Click -> tell parent to stop
  stopBtn.addEventListener('click', () => {
    window.parent.postMessage({ type:'stop-click' }, '*');
  });

  // Click on a follow-up suggestion -> parent sends it as the next question
  log.addEventListener('click', (e) => {
    const btn = e.target.closest('.otb-suggestion');
    if (btn) window.parent.postMessage({ type:'suggestion-click', value: btn.dataset.q || btn.textContent }, '*');
  });

  // Messages from parent page
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d.type === 'ping'){ announceReady(); } // parent may have missed the load-time announcement
    if (d.type === 'clear-chat'){
      log.innerHTML = '';
      lastWasBot = false;
      syncStatusTimer();
    }
    if (d.type === 'set-theme-vars' && d.vars){
      Object.entries(d.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
      updateHeights();
      // no scroll here
    }
    if (d.type === 'set-avatars'){ userAvatar = d.user || userAvatar; botAvatar = d.bot || botAvatar; }
    if (d.type === 'add-message'){ addMessage({ who: d.from, html: d.html || '' }); }
    if (d.type === 'update-bot-html'){ updateBotHtml(d.html || '', d.cursor !== false); }
    if (d.type === 'finalize-bot'){ finalizeBot(d.html || ''); }

    if (d.type === 'set-stop-visible'){
      stopBtn.style.display = d.visible ? 'inline-flex' : 'none';
      updateHeights();
      // no scroll here
    }
  });

  // Handshake
  announceReady();
</script>
</body>
</html>
