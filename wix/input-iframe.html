<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      :root{
        --ink: #0f172a;                       /* text color */
        --muted: #6b7280;                     /* placeholder */
        --ring: rgba(199,75,249,0.40);        /* 40% opacity glow */
        --purple: #6A15E1;                    /* hover/focus border */
        --bg: transparent;
      }

      html, body{
        margin:0;
        padding:0;
        background:transparent;
        overflow:hidden;
        height:100%;
        min-height:100vh;
        display:block;
      }

      *{ box-sizing:border-box }

      .wrap{
        width:100%;
        max-width:none;
        padding:8px;
      }

      /* DEFAULT: white background, black border */
      textarea{
        width:100%;
        min-height:24px;
        max-height:80px;

        background:#fff;
        color:var(--ink);
        border:2px solid #000;           /* black border only */
        border-radius:12px;
        padding:12px 14px;

        font:14px/1.5 -apple-system, BlinkMacSystemFont, "Google Sans Medium",
              Roboto, Inter, system-ui, sans-serif;

        resize:none;
        overflow-y:auto;
        scrollbar-width:none;

        box-shadow:0 0 6px rgba(0,0,0,0.08); /* subtle lift */
        transition: box-shadow .25s, border-color .25s, background .25s;
        caret-color:#000;
      }

      textarea::placeholder{ color:var(--muted) }

      /* HOVER/FOCUS: purple border + 40% glow */
      textarea:hover,
      textarea:focus{
        border-color:var(--purple);
        box-shadow:
          0 0 0 1px var(--ring),        /* glow with 40% opacity */
          0 0 12px rgba(0,0,0,0.25);    /* subtle outer halo */
        outline:none;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <textarea id="ta" placeholder="Shoot Your Thoughts..."></textarea>
    </div>

    <script>
      const ta = document.getElementById("ta");

      const TIERS = [40, 60, 80];
      const PADDING_AROUND = 16;
      const EXTRA_BUFFER = 4;

      function snapHeight(scrollH){
        for (let i=0;i<TIERS.length;i++){
          if (scrollH <= TIERS[i]) return TIERS[i];
        }
        return TIERS[TIERS.length-1];
      }

      function autoGrow(){
        ta.style.height = "auto";
        const natural = ta.scrollHeight;
        const snapped = snapHeight(natural);
        ta.style.height = snapped + "px";

        const total = snapped + PADDING_AROUND + EXTRA_BUFFER;
        parent.postMessage({ type: "input-height", height: total }, "*");
      }

      function triggerSend(){
        const value = (ta.value || "").trim();
        if (!value) return;
        parent.postMessage({ type: "send-intent", value }, "*");
      }

      ta.addEventListener("input", autoGrow);
      ta.addEventListener("keydown", (e) => {
        // isComposing: Enter that confirms an IME word (e.g. Japanese/Chinese input) isn't a send
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
          e.preventDefault();
          triggerSend();
        }
      });

      window.addEventListener("message", (e) => {
        const d = e.data || {};
        if (d.type === "set-disabled") ta.disabled = !!d.disabled;
        if (d.type === "focus") ta.focus();
        if (d.type === "set-value"){ ta.value = d.value || ""; autoGrow(); }
        if (d.type === "force-send") triggerSend();
        if (d.type === "get-value"){
          parent.postMessage({ type: "value", value: (ta.value || "").trim() }, "*");
        }
      });

      autoGrow();
      parent.postMessage({ type: "input-ready" }, "*");
    </script>
  </body>
</html>
